<svg viewBox="0 0 640 1580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #fefcfa; }
      .frame { fill: none; stroke: #A88538; stroke-width: 2; }
      .spine { stroke: #0D3535; stroke-width: 3; fill: none; }
      .card { fill: none; stroke: #0D3535; stroke-width: 2.5; }
      .dot { fill: #fefcfa; stroke: #0D3535; stroke-width: 3; }
      .dot-accent { fill: #A88538; stroke: #A88538; }
      .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 25px; letter-spacing: 3px; fill: #0D3535; }
      .sub { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 18px; fill: #6b6b66; }
      .kicker { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 5px; fill: #A88538; text-transform: uppercase; }
      .item { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; fill: #0D3535; }
      .nest { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 2px; fill: #A88538; }
      .tri { fill: #A88538; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="640" height="1580"/>
  <rect class="frame" x="16" y="16" width="608" height="1548"/>

  <text class="kicker" x="320" y="68" text-anchor="middle">THE TOUCH LANGUAGES SYSTEM</text>
  <text x="320" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#0D3535" font-style="italic">The Stack</text>

  <!-- Spine, only in the gaps between cards -->
  <path class="tri" d="M 308 168 L 332 168 L 320 148 Z"/>
  <line class="spine" x1="320" y1="180" x2="320" y2="220"/>
  <line class="spine" x1="320" y1="500" x2="320" y2="560"/>
  <line class="spine" x1="320" y1="840" x2="320" y2="900"/>
  <line class="spine" x1="320" y1="1180" x2="320" y2="1240"/>

  <!-- Band 1: Touch Language -->
  <circle class="dot" cx="320" cy="220" r="10"/>
  <rect class="card" x="60" y="220" width="520" height="280" rx="20"/>
  <text class="label" x="320" y="320" text-anchor="middle">TOUCH LANGUAGE</text>
  <text class="sub" x="320" y="354" text-anchor="middle">what reaches you</text>
  <text class="item" x="320" y="400" text-anchor="middle">Emotional · Erotic · Energetic</text>
  <text class="item" x="320" y="424" text-anchor="middle">Physical · Spiritual</text>

  <!-- Nesting note between band 1 and 2 -->
  <text class="nest" x="580" y="533" text-anchor="end">↳ UNDER EROTIC</text>

  <!-- Band 2: Pleasure Language -->
  <circle class="dot dot-accent" cx="320" cy="560" r="10"/>
  <rect class="card" x="60" y="560" width="520" height="280" rx="20"/>
  <text class="label" x="320" y="660" text-anchor="middle">PLEASURE LANGUAGE</text>
  <text class="sub" x="320" y="694" text-anchor="middle">which current, inside Erotic touch</text>
  <text class="item" x="320" y="740" text-anchor="middle">Energetic · Sensual · Sexual</text>
  <text class="item" x="320" y="764" text-anchor="middle">Kinky · Shapeshifter</text>

  <!-- Band 3: Pattern -->
  <circle class="dot" cx="320" cy="900" r="10"/>
  <rect class="card" x="60" y="900" width="520" height="280" rx="20"/>
  <text class="label" x="320" y="1000" text-anchor="middle">PATTERN</text>
  <text class="sub" x="320" y="1034" text-anchor="middle">how you protect yourself</text>
  <text class="item" x="320" y="1080" text-anchor="middle">Holder · Flame · Armour</text>
  <text class="item" x="320" y="1104" text-anchor="middle">Signal · Current</text>

  <!-- Band 4: Touch State -->
  <circle class="dot" cx="320" cy="1240" r="10"/>
  <rect class="card" x="60" y="1240" width="520" height="280" rx="20"/>
  <text class="label" x="320" y="1340" text-anchor="middle">TOUCH STATE</text>
  <text class="sub" x="320" y="1374" text-anchor="middle">where you are, underneath it all</text>
  <text class="item" x="320" y="1420" text-anchor="middle">Braced · Withheld · Performing</text>
  <text class="item" x="320" y="1444" text-anchor="middle">Present · Melted</text>

  <text x="320" y="1512" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#070707" opacity="0.6">Languages · States · Patterns after Juliette Karaman.</text>
  <text x="320" y="1534" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#070707" opacity="0.6">Pleasure Languages after Jaiya Ma.</text>
</svg>
